<div class="carousel-container">
  <div class="carousel-track">
    <div class="logo-group">
      @for (logo of logos(); track logo) {
        <img [ngSrc]="logo" width="140" height="70" alt="Partner Logo" class="logo-item" />
      }
    </div>
    <div class="logo-group" aria-hidden="true">
      @for (logo of logos(); track logo) {
        <img [ngSrc]="logo" width="140" height="70" alt="" class="logo-item" />
      }
    </div>
  </div>
</div>
